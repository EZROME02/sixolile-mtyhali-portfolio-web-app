name: Human Release Approval

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number
        required: true
        type: string
      expected_sha:
        description: Exact PR head SHA approved by the human
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  approve:
    name: Verify SHA and release readiness
    runs-on: ubuntu-latest
    steps:
      - name: Set up GitHub CLI
        run: gh --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify current PR head SHA
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          PR_JSON="$(gh pr view "${{ inputs.pr_number }}" --json state,headRefOid,isDraft)"
          STATE="$(jq -r '.state' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.headRefOid' <<<"$PR_JSON")"
          IS_DRAFT="$(jq -r '.isDraft' <<<"$PR_JSON")"

          [[ "$STATE" == "OPEN" ]] || { echo "PR is not open."; exit 1; }
          [[ "$HEAD_SHA" == "${{ inputs.expected_sha }}" ]] || {
            echo "SHA mismatch: current PR head is $HEAD_SHA, supplied approval SHA is ${{ inputs.expected_sha }}.";
            exit 1;
          }
          [[ "$IS_DRAFT" == "true" ]] || { echo "PR is already ready for review; no transition needed."; exit 0; }

          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Require successful Release Gate for exact SHA
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(gh run list --workflow release-gate.yml --commit "${{ inputs.expected_sha }}" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          if [[ "$COUNT" -lt 1 ]]; then
            echo "No successful Release Gate run exists for exact SHA ${{ inputs.expected_sha }}."
            exit 1
          fi
          echo "A successful Release Gate exists for exact SHA ${{ inputs.expected_sha }}."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mark PR ready for review
        if: ${{ steps.pr.outputs.head_sha != '' }}
        run: gh pr ready "${{ inputs.pr_number }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Confirm no merge occurred
        run: |
          echo "Human approval completed for exact SHA ${{ inputs.expected_sha }}."
          echo "This workflow does not merge the pull request or enable auto-merge."
