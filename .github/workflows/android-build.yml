name: EZROME Android Build

on:
  push:
    branches:
      - main
      - feat/ezrome-android-app
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        working-directory: .
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ezrome-android-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
