name: EZROME Lockfile Repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.pull_request.head.sha, 'LOCK_REPAIR_DONE')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 1
      - name: Checkout branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Regenerate lockfile from package manifest
        run: bun install --lockfile-only
      - name: Commit regenerated lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "LOCKFILE_CHANGED=false" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "fix: sync Bun lockfile with Playwright test dependency [LOCK_REPAIR_DONE]"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          echo "LOCKFILE_CHANGED=true" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify updated head SHA
        if: github.event_name == 'pull_request'
        id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dispatch release gate against repaired SHA
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          gh workflow run ezrome-release-gate.yml \
            --repo "$REPO" \
            --ref "$REF" \
            -f release=false \
            -f expected_sha="$EXPECTED_SHA"
