name: Signing Agent Tests

on:
  push:
    paths:
      - 'tools/signing_agent/**'
  pull_request:
    paths:
      - 'tools/signing_agent/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tools/signing_agent -p 'test_*.py' -v
      - name: Compile Python
        run: python -m py_compile tools/signing_agent/signing_agent.py
