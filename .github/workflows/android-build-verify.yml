name: EZROME Android Build Verify

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ezrome-android-app

permissions:
  contents: read

jobs:
  verify-android-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Verify APK files and calculate SHA-256
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          DEBUG_SHA=$(sha256sum "$DEBUG_APK" | awk '{print $1}')
          RELEASE_SHA=$(sha256sum "$RELEASE_APK" | awk '{print $1}')
          DEBUG_SIZE=$(stat -c%s "$DEBUG_APK")
          RELEASE_SIZE=$(stat -c%s "$RELEASE_APK")
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "debug_size=${DEBUG_SIZE}"
            echo "debug_sha=${DEBUG_SHA}"
            echo "release_size=${RELEASE_SIZE}"
            echo "release_sha=${RELEASE_SHA}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## EZROME Android verification"
            echo "- Result: **PASS**"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Debug APK: \`${DEBUG_APK}\` (${DEBUG_SIZE} bytes)"
            echo "- Debug SHA-256: \`${DEBUG_SHA}\`"
            echo "- Release APK: \`${RELEASE_APK}\` (${RELEASE_SIZE} bytes)"
            echo "- Release SHA-256: \`${RELEASE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ezrome-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ezrome-release-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
