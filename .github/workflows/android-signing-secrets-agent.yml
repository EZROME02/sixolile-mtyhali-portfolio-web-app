name: EZROME Android Signing Secrets Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-signing-secrets:
    name: Validate production signing secret presence
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secret presence
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SMTYHALI_SIGNER_SHA256: ${{ secrets.SMTYHALI_SIGNER_SHA256 }}
        shell: bash
        run: |
          set -u
          failed=0
          {
            echo "## EZROME Production Signing Secrets Agent"
            echo
            echo "This agent checks presence only. Secret values are never printed."
            echo
            for name in \
              ANDROID_KEYSTORE_BASE64 \
              ANDROID_STORE_PASSWORD \
              ANDROID_KEY_ALIAS \
              ANDROID_KEY_PASSWORD \
              SMTYHALI_SIGNER_SHA256; do
              if [ -n "${!name}" ]; then
                echo "- ${name}: PRESENT"
              else
                echo "- ${name}: MISSING"
                failed=1
              fi
            done
            echo
            if [ "$failed" -eq 0 ]; then
              echo "### Result"
              echo "All required production signing secrets are present."
            else
              echo "### Result"
              echo "One or more required production signing secrets are missing."
            fi
          } | tee "$RUNNER_TEMP/signing-secrets-report.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - name: Upload safe validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ezrome-signing-secrets-validation-${{ github.run_number }}
          path: ${{ runner.temp }}/signing-secrets-report.md
          if-no-files-found: error
          retention-days: 14
