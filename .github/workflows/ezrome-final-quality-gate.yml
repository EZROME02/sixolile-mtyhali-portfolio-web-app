name: EZROME Final Quality + Release Evidence Gate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to verify (defaults to the dispatched commit)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ezrome-final-quality-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}

jobs:
  bun-quality:
    name: Bun Test + Lint + Build Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Bun tests
        run: bun test
      - name: Web lint
        run: bun run lint
      - name: Production web build
        run: bun run build

  android-quality:
    name: Gradle Debug Quality Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Gradle lint debug
        working-directory: android
        run: gradle --no-daemon --stacktrace lintDebug
      - name: Gradle debug test/build
        working-directory: android
        run: gradle --no-daemon --stacktrace test assembleDebug

  mobile-e2e:
    name: Mobile E2E Agent
    runs-on: ubuntu-latest
    needs: bun-quality
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build web app
        run: bun run build
      - name: Start preview server
        run: |
          bun run preview --host 0.0.0.0 > /tmp/ezrome-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/ezrome-preview.log
          exit 1
      - name: Run mobile browser E2E
        run: |
          bunx --package=@playwright/test playwright install --with-deps chromium
          bunx --package=@playwright/test playwright test tests/mobile-e2e.spec.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ezrome-mobile-e2e-${{ github.run_number }}
          path: mobile-e2e.png
          if-no-files-found: ignore
          retention-days: 14

  exact-sha:
    name: Exact SHA Anti-Hallucination Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - name: Verify checkout SHA exactly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          remote="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/$EXPECTED_SHA" --jq '.sha')"
          test "$remote" = "$EXPECTED_SHA"
          echo "EXACT_SHA=PASS"
          echo "Verified commit: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

  production-evidence:
    name: Production Release Evidence Gate
    runs-on: ubuntu-latest
    steps:
      - name: Find exact production run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=""
          for attempt in $(seq 1 12); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/android-production-release.yml/runs?branch=main&event=workflow_dispatch&per_page=50")"
            found="$(printf '%s' "$runs" | jq -r --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' | head -n1)"
            [ -n "$found" ] && break
            sleep 10
          done
          if [ -z "$found" ]; then
            echo "PRODUCTION_EVIDENCE=BLOCKED: no real workflow_dispatch run for $EXPECTED_SHA" >&2
            exit 1
          fi
          echo "run_id=$found" >> "$GITHUB_ENV"
          echo "Production run: #$found"
      - name: Wait for production run completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.status')"
            conclusion="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.conclusion // ""')"
            echo "#${run_id}: $status $conclusion"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              break
            fi
            sleep 15
          done
      - name: Verify production jobs and APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.head_sha')"
          test "$run_sha" = "$EXPECTED_SHA"
          failed="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/jobs?per_page=100" | jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped")] | length')"
          test "$failed" = 0
          artifacts="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/artifacts?per_page=100")"
          count="$(printf '%s' "$artifacts" | jq '[.artifacts[] | select(.expired == false and (.name | startswith("ezrome-android-production-")))] | length')"
          test "$count" -ge 1
          echo "PRODUCTION_EVIDENCE=PASS"
          {
            echo '## Production Evidence — VERIFIED'
            echo "- Exact commit: \`$EXPECTED_SHA\`"
            echo "- Production run: #$run_id"
            echo '- Run conclusion: success'
            echo '- Jobs: all non-skipped jobs successful'
            echo '- Production APK artifact: present'
          } >> "$GITHUB_STEP_SUMMARY"

  final-release-gate:
    name: FINAL RELEASE GATE
    runs-on: ubuntu-latest
    needs: [bun-quality, android-quality, mobile-e2e, exact-sha, production-evidence]
    if: always()
    steps:
      - name: Publish authoritative final result
        run: |
          set -euo pipefail
          echo "Bun quality: ${{ needs.bun-quality.result }}"
          echo "Android quality: ${{ needs.android-quality.result }}"
          echo "Mobile E2E: ${{ needs.mobile-e2e.result }}"
          echo "Exact SHA: ${{ needs.exact-sha.result }}"
          echo "Production evidence: ${{ needs.production-evidence.result }}"
          if [ "${{ needs.bun-quality.result }}" != success ] || \
             [ "${{ needs.android-quality.result }}" != success ] || \
             [ "${{ needs.mobile-e2e.result }}" != success ] || \
             [ "${{ needs.exact-sha.result }}" != success ] || \
             [ "${{ needs.production-evidence.result }}" != success ]; then
            echo "FINAL_RELEASE_GATE=BLOCKED"
            exit 1
          fi
          echo "FINAL_RELEASE_GATE=VERIFIED"
          {
            echo '## EZROME FINAL RELEASE GATE — VERIFIED'
            echo
            echo "- Exact SHA: \`$EXPECTED_SHA\`"
            echo '- Bun test/lint/build: PASS'
            echo '- Android Gradle lint/debug tests/build: PASS'
            echo '- Mobile E2E: PASS'
            echo '- Exact SHA anti-hallucination gate: PASS'
            echo '- Production release evidence: PASS'
            echo
            echo '**Final result: VERIFIED**'
          } >> "$GITHUB_STEP_SUMMARY"
