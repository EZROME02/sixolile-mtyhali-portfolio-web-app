name: Android APK Debug and Verify Agent

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ezrome-android-app

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-debug-verify-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE: com.ezrome.app
  BUILD_TOOLS: 35.0.0

jobs:
  debug-apk:
    name: Build, debug, verify and upload debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee ../debug-build.log

      - name: Locate and verify debug APK
        id: debug
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find android/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' | sort)
          test "${#APKS[@]}" -eq 1 || { echo "BLOCKED: expected exactly one debug APK; found ${#APKS[@]}."; exit 1; }
          APK="${APKS[0]}"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='$EXPECTED_PACKAGE'"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo '## Debug APK verification'
            echo '- Build: PASS'
            echo '- Package: PASS (`com.ezrome.app`)'
            echo '- Signature: PASS'
            echo "- SHA-256: $SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: ${{ steps.debug.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-diagnostics-${{ github.sha }}
          path: debug-build.log
          if-no-files-found: ignore
          retention-days: 14

  release-apk:
    name: Build, verify and upload production release APK
    needs: debug-apk
    environment:
      name: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production signing secrets exist
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_SIGNER_SHA256: ${{ secrets.SMTYHALI_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'BLOCKED: ANDROID_KEYSTORE_BASE64 is not configured.'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'BLOCKED: ANDROID_STORE_PASSWORD is not configured.'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'BLOCKED: ANDROID_KEY_ALIAS is not configured.'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'BLOCKED: ANDROID_KEY_PASSWORD is not configured.'; exit 1; }
          test -n "$EXPECTED_SIGNER_SHA256" || { echo 'BLOCKED: SMTYHALI_SIGNER_SHA256 is not configured.'; exit 1; }
          echo 'Production signing configuration is present.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Materialize production keystore on runner
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/smtyhali-release.keystore
          test -s android/smtyhali-release.keystore

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/smtyhali-release.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify release APK and calculate SHA-256
        id: release
        shell: bash
        env:
          EXPECTED_SIGNER_SHA256: ${{ secrets.SMTYHALI_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print)
          test "${#APKS[@]}" -eq 1 || { echo "BLOCKED: expected exactly one signed release APK; found ${#APKS[@]}."; exit 1; }
          APK="${APKS[0]}"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='$EXPECTED_PACKAGE'"
          CERTS=$(mktemp)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$CERTS"
          ACTUAL=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' "$CERTS" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$ACTUAL" || { echo 'BLOCKED: release signer fingerprint could not be extracted.'; exit 1; }
          test "$ACTUAL" = "$EXPECTED" || { echo 'BLOCKED: release signer does not match SMTYHALI_SIGNER_SHA256.'; exit 1; }
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo '## Release APK verification'
            echo '- Build: PASS'
            echo '- Package: PASS (`com.ezrome.app`)'
            echo '- Signer: PASS (`s.mtyhali`)'
            echo "- SHA-256: $SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.sha }}
          path: ${{ steps.release.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup production keystore
        if: always()
        shell: bash
        run: rm -f android/smtyhali-release.keystore
