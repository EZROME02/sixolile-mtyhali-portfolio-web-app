name: EZROME PR Quality + SEO Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Bun Test + Lint + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Bun tests
        run: bun test
      - name: Web lint
        run: bun run lint
      - name: Production web build
        run: bun run build

  mobile-e2e:
    name: Mobile E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Start preview server
        run: |
          bun run preview --host 0.0.0.0 > /tmp/ezrome-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/ezrome-preview.log
          exit 1
      - name: Run mobile browser E2E
        run: |
          bunx --package=@playwright/test playwright install --with-deps chromium
          bunx --package=@playwright/test playwright test tests/mobile-e2e.spec.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ezrome-mobile-e2e-${{ github.run_number }}
          path: mobile-e2e.png
          if-no-files-found: ignore
          retention-days: 14

  seo-verification:
    name: Sitemap + Robots + Metadata + JSON-LD
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Start preview server
        run: |
          bun run preview --host 0.0.0.0 > /tmp/ezrome-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/ezrome-preview.log
          exit 1
      - name: Verify robots.txt and sitemap.xml
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:4173/robots.txt | grep -F 'Sitemap: https://ezrome.co.za/sitemap.xml'
          curl -fsS http://127.0.0.1:4173/sitemap.xml > /tmp/sitemap.xml
          grep -F '<loc>https://ezrome.co.za/</loc>' /tmp/sitemap.xml
          grep -F '<loc>https://ezrome.co.za/projects</loc>' /tmp/sitemap.xml
          test "$(grep -c '<loc>https://ezrome.co.za/' /tmp/sitemap.xml)" -eq 6
      - name: Verify every sitemap URL resolves
        run: |
          set -euo pipefail
          grep -o 'https://ezrome.co.za/[^<]*' /tmp/sitemap.xml | while read -r url; do
            path="${url#https://ezrome.co.za}"
            test -n "$path" || path=/
            curl -fsS -o /dev/null "http://127.0.0.1:4173${path}"
          done
      - name: Verify canonical metadata and JSON-LD
        run: |
          set -euo pipefail
          homepage="$(curl -fsS http://127.0.0.1:4173/)"
          projects="$(curl -fsS http://127.0.0.1:4173/projects)"
          intelligence="$(curl -fsS http://127.0.0.1:4173/ezrome-intelligence)"
          printf '%s' "$homepage" | grep -F 'EZROME — Sixolile Ezrome Mtyhali | AI Developer'
          printf '%s' "$homepage" | grep -F 'application/ld+json'
          printf '%s' "$homepage" | grep -F 'https://ezrome.co.za'
          printf '%s' "$projects" | grep -F 'EZROME Assist Bot'
          printf '%s' "$intelligence" | grep -F 'EZROME Technology Intelligence'
          printf '%s' "$intelligence" | grep -F 'application/ld+json' || true
          echo 'SEO_VERIFICATION=PASS' >> "$GITHUB_STEP_SUMMARY"
