name: Release Gate Staleness Guard

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  invalidate:
    name: Invalidate prior release verification
    runs-on: ubuntu-latest
    steps:
      - name: Mark prior verification stale and require fresh gate
        shell: bash
        run: |
          set -euo pipefail
          echo "PR #${{ github.event.pull_request.number }} advanced to SHA ${{ github.event.pull_request.head.sha }}."
          echo "Any Release Gate result from an earlier SHA is stale and cannot authorize release."
          echo "A new Release Gate run must verify this exact SHA before the PR Agent can certify release readiness."
          echo "STALENESS_GUARD=PASS"
          echo "This check is informational; it never authorizes release by itself."
