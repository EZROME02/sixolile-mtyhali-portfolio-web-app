plugins { id 'com.android.application' }

android {
    namespace 'com.ezrome.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ezrome.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def signingEnv = { String name ->
        def value = System.getenv(name)
        if (value == null || value.trim().isEmpty()) {
            throw new GradleException("Missing required production signing environment variable: ${name}")
        }
        return value
    }

    signingConfigs {
        release {
            storeFile file(signingEnv('ANDROID_KEYSTORE_PATH'))
            storePassword signingEnv('ANDROID_STORE_PASSWORD')
            keyAlias signingEnv('ANDROID_KEY_ALIAS')
            keyPassword signingEnv('ANDROID_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
